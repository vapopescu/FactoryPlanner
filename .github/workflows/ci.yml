name: Mod CI
on: [push, pull_request]
jobs:
  save-create:
    runs-on: self-hosted
    if: github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true
      - name: Update Factorio
        run: bash tests/update-factorio.sh
      - name: Run save-create
        run: python tests/run.py save-create

  suite:
    runs-on: self-hosted
    if: github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # Configurations are discovered within each suite
        suite: [lib, data, generator, solver, gui]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true
      - name: Update Factorio
        run: bash tests/update-factorio.sh
      - name: Run ${{ matrix.suite }}
        run: python tests/run.py suite ${{ matrix.suite }}
